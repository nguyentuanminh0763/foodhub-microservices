server:
  port: 8081

# Every value has a DEFAULT after the ':' so the service can be run straight from
# the IDE with no env setup (it then talks to the dockerised MySQL on localhost:3307).
# docker-compose passes real env vars, which override these defaults.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/foodhub_auth}
    username: ${SPRING_DATASOURCE_USERNAME:foodhub}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update   # OK for a learning project; never use in real production
    show-sql: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-at-least-32-bytes-long}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
