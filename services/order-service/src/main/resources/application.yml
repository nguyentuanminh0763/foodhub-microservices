server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# URL of the restaurant-service, used for the SYNC REST call (see RestaurantClient)
restaurant:
  service:
    url: ${RESTAURANT_SERVICE_URL}
