# FoodHub — Phase 1 orchestration.
#
# Task 1.4 state: databases only. Services are added in tasks 1.5-1.7,
# Kafka in Phase 3, Redis in Phase 4. Nothing is added before it is needed.
#
# Two ways to run — see docs/RUNNING.md:
#   1. Fast loop (while coding one service): start only its database.
#        docker compose up -d restaurants-db
#   2. Full system (integration check):
#        docker compose up --build

services:

  # ---------- Databases: one per service (database-per-service) ----------
  # Host ports are published so a service can run from the terminal and still
  # reach its database. 5433/5434 avoid colliding with a Postgres already on
  # 5432. Inside the compose network services still use 5432.

  restaurants-db:
    image: postgres:16
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: ${RESTAURANTS_DB_NAME}
      POSTGRES_USER: ${RESTAURANTS_DB_USER}
      POSTGRES_PASSWORD: ${RESTAURANTS_DB_PASSWORD}
    volumes: [restaurants_data:/var/lib/postgresql/data]
    # Without this, depends_on only waits for the CONTAINER to start, not for
    # Postgres to accept connections - and a Node process boots much faster
    # than Postgres initialises. See CLAUDE_RULES.md trap #3.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  orders-db:
    image: postgres:16
    ports: ["5434:5432"]
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME}
      POSTGRES_USER: ${ORDERS_DB_USER}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD}
    volumes: [orders_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------- Services (tasks 1.5 - 1.7) ----------
  # restaurant  :3001  depends_on restaurants-db (service_healthy)
  # order       :3002  depends_on orders-db (service_healthy)
  # gateway     :3000  the only published port once it exists

  # ---------- Phase 3: kafka + kafka-ui + notification ----------
  # ---------- Phase 4: redis ----------

volumes:
  restaurants_data:
  orders_data:
