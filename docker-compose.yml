# FoodHub - Phase 1 orchestration.
# `docker compose up --build` should bring the whole Phase 1 system up.
# Phase 2 services (RabbitMQ, Payment, Notification) are scaffolded but commented out.
#
# TWO WAYS TO RUN — see docs/RUNNING.md:
#   1. Fast loop (while coding one service): start only its DB, run the service from the IDE.
#        docker compose up -d auth-mysql
#   2. Full system (integration check):
#        docker compose up --build
services:

  # ---------- Databases (one per service - DB-per-service pattern) ----------
  # Host ports are published so you can run a service from the IDE and still reach
  # its database. Non-standard host ports (3307/3308) avoid clashing with a MySQL
  # you may already have on 3306. Inside the compose network services still use 3306.
  auth-mysql:
    image: mysql:8.0
    ports: ["3307:3306"]
    environment:
      MYSQL_DATABASE: ${AUTH_DB_NAME}
      MYSQL_USER: ${AUTH_DB_USER}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes: [auth_mysql_data:/var/lib/mysql]
    # Without this, `depends_on` only waits for the CONTAINER to start, not for MySQL
    # to accept connections — and Spring Boot boots faster than MySQL initialises.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  order-mysql:
    image: mysql:8.0
    ports: ["3308:3306"]
    environment:
      MYSQL_DATABASE: ${ORDER_DB_NAME}
      MYSQL_USER: ${ORDER_DB_USER}
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes: [order_mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # ---------- Services ----------
  auth-service:
    build: ./services/auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://auth-mysql:3306/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      auth-mysql:
        condition: service_healthy

  restaurant-service:
    build: ./services/restaurant-service
    environment:
      MONGO_URI: ${RESTAURANT_MONGO_URI}
      PORT: 3001
    depends_on:
      mongo:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://order-mysql:3306/${ORDER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
      RESTAURANT_SERVICE_URL: ${RESTAURANT_SERVICE_URL}
    depends_on:
      order-mysql:
        condition: service_healthy
      restaurant-service:
        condition: service_started

  gateway:
    build: ./gateway
    ports: ["8080:8080"]   # the ONLY port exposed to the outside world
    depends_on:
      auth-service:
        condition: service_started
      restaurant-service:
        condition: service_started
      order-service:
        condition: service_started

  # ---------- Phase 2 (uncomment when you reach Phase 2) ----------
  # rabbitmq:
  #   image: rabbitmq:3-management
  #   ports: ["15672:15672"]   # management UI
  #
  # payment-service:
  #   build: ./services/payment-service
  #   depends_on: [rabbitmq]
  #
  # notification-service:
  #   build: ./services/notification-service
  #   depends_on: [rabbitmq]

volumes:
  auth_mysql_data:
  order_mysql_data:
  mongo_data:
