name: FoodHub CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, restaurant, order, payment, notification]
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodhub
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: foodhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodhub -d foodhub_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      DATABASE_URL: postgresql://foodhub:test-password@localhost:5432/foodhub_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: contains(fromJSON('["restaurant", "order", "payment"]'), matrix.service)
        run: npx --no-install prisma migrate deploy
      - run: npm test -- --runInBand

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/setup-env.mjs
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: node scripts/smoke.mjs
      - if: failure()
        run: docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down
